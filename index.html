<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quale sarà la banconota più bella d'Europa?</title>
<meta name="description" content="Vota a due a due le dieci proposte di design per le future banconote in euro e scopri la classifica calcolata con il modello Bradley–Terry.">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B6%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#vota">
      <span class="brand-mark">€</span>
      <span class="brand-text">
        <strong data-i18n="brand.title"></strong>
        <small data-i18n="brand.tagline"></small>
      </span>
    </a>
    <nav class="nav">
      <a href="#vota" data-view="vota" data-i18n="nav.vote"></a>
      <a href="#classifica" data-view="classifica" data-i18n="nav.ranking"></a>
      <a href="#design" data-view="design" data-i18n="nav.designs"></a>
      <a href="#metodo" data-view="metodo" data-i18n="nav.method"></a>
    </nav>
  </div>
</header>

<main class="wrap">

  <!-- ============================================================ VOTA -->
  <section id="view-vota" class="view">

    <div class="vote-head">
      <p class="vote-hint" data-i18n-html="vote.hintHtml"></p>
    </div>

    <div class="arena" id="arena">
      <button class="note-card" id="card-left" type="button">
        <span class="note-sides">
          <span class="note-figure"><img alt="" id="img-left-front" decoding="async"></span>
          <span class="note-figure"><img alt="" id="img-left-back" decoding="async"></span>
        </span>
        <span class="note-meta">
          <span class="note-letter" id="letter-left"></span>
          <span class="note-designer" id="designer-left"></span>
        </span>
      </button>

      <div class="versus" aria-hidden="true"><span>vs</span></div>

      <button class="note-card" id="card-right" type="button">
        <span class="note-sides">
          <span class="note-figure"><img alt="" id="img-right-front" decoding="async"></span>
          <span class="note-figure"><img alt="" id="img-right-back" decoding="async"></span>
        </span>
        <span class="note-meta">
          <span class="note-letter" id="letter-right"></span>
          <span class="note-designer" id="designer-right"></span>
        </span>
      </button>
    </div>

    <div class="arena-actions">
      <button type="button" class="btn ghost" id="btn-skip" data-i18n="vote.skip"></button>
      <p class="vote-count" id="vote-count"></p>
    </div>

    <p class="kbd-hint" data-i18n-html="vote.kbdHtml"></p>

    <div class="banner" id="mode-banner" hidden></div>
  </section>

  <!-- ======================================================= CLASSIFICA -->
  <section id="view-classifica" class="view" hidden>
    <div class="rank-head">
      <h1 data-i18n="rank.title"></h1>
      <div class="seg" role="group" aria-label="Tipo di classifica">
        <button type="button" class="seg-btn is-active" data-scope="generale" data-i18n="scope.general"></button>
        <button type="button" class="seg-btn" data-scope="famiglie" data-i18n="scope.design"></button>
        <button type="button" class="seg-btn" data-scope="tagli" data-i18n="scope.denomination"></button>
      </div>
    </div>

    <p class="rank-summary" id="rank-summary"></p>

    <div id="rank-generale">
      <p class="scope-note" data-i18n-html="rank.noteGeneralHtml"></p>
      <ol class="ranking" id="ranking-all-list"></ol>
    </div>

    <div id="rank-families" hidden>
      <p class="scope-note" data-i18n="rank.noteDesign"></p>
      <ol class="ranking" id="ranking-list"></ol>
    </div>

    <div id="rank-denoms" hidden>
      <div class="denom-picker">
        <span class="denom-label" data-i18n="rank.denomLabel"></span>
        <div class="denom-buttons" id="rank-denom-buttons"></div>
      </div>
      <ol class="ranking" id="ranking-denom-list"></ol>

      <h2 class="matrix-title" data-i18n="matrix.title"></h2>
      <p class="matrix-note" data-i18n="matrix.note"></p>
      <div class="matrix-scroll">
        <table class="matrix" id="matrix"></table>
      </div>
    </div>
  </section>

  <!-- ========================================================== DESIGN -->
  <section id="view-design" class="view" hidden>
    <h1 data-i18n="designs.title"></h1>
    <p class="lede" data-i18n-html="designs.ledeHtml"></p>
    <div class="design-grid" id="design-grid"></div>
  </section>

  <!-- ========================================================== METODO -->
  <section id="view-metodo" class="view" hidden>
    <h1 data-i18n="method.title"></h1>
    <div id="method-body"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-controls">
      <div class="picker">
        <span class="picker-label" data-i18n="footer.theme"></span>
        <div class="seg seg-sm" id="theme-buttons" role="group"></div>
      </div>
      <div class="picker">
        <span class="picker-label" data-i18n="footer.language"></span>
        <div class="seg seg-sm" id="lang-buttons" role="group"></div>
      </div>
    </div>
    <p class="footer-note" data-i18n-html="footer.attributionHtml"></p>
  </div>
</footer>

<script type="module" src="src/app.js"></script>
</body>
</html>
