<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quale sarà la banconota più bella d'Europa?</title>
<meta name="description" content="Vota a due a due le dieci proposte di design per le future banconote in euro e scopri la classifica calcolata con il modello Bradley–Terry.">
<link rel="stylesheet" href="assets/css/style.css?v=cf4cb2bf">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B6%3C/text%3E%3C/svg%3E">
</head>
<body>

<a class="skip-link" href="#main" data-i18n="a11y.skip"></a>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="#vota">
      <span class="brand-mark">€</span>
      <span class="brand-text">
        <strong data-i18n="brand.title"></strong>
        <small data-i18n="brand.tagline"></small>
      </span>
    </a>
    <nav class="nav">
      <a href="#vota" data-view="vota" data-i18n="nav.vote"></a>
      <a href="#classifica" data-view="classifica" data-i18n="nav.ranking"></a>
      <a href="#design" data-view="design" data-i18n="nav.designs"></a>
      <a href="#metodo" data-view="metodo" data-i18n="nav.method"></a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">

  <!-- ============================================================ VOTA -->
  <section id="view-vota" class="view" tabindex="-1">
    <!-- Visivamente nascosta: la barra e il contenuto dicono gia' dove si e',
         e su un telefono ogni riga di testo e' spazio tolto alle banconote.
         Per chi usa uno screen reader era pero' l'unica vista senza titolo. -->
    <h1 class="visually-hidden" data-i18n="vote.title"></h1>

    <div class="vote-head">
      <p class="vote-hint" data-i18n-html="vote.hintHtml"></p>
    </div>

    <div class="arena">
      <button class="note-card" id="card-left" type="button">
        <span class="note-sides">
          <img alt="" id="img-left-front" decoding="async">
          <img alt="" id="img-left-back" decoding="async">
        </span>
      </button>

      <div class="versus" aria-hidden="true"><span>vs</span></div>

      <button class="note-card" id="card-right" type="button">
        <span class="note-sides">
          <img alt="" id="img-right-front" decoding="async">
          <img alt="" id="img-right-back" decoding="async">
        </span>
      </button>
    </div>

    <div class="arena-actions">
      <button type="button" class="btn ghost" id="btn-skip" data-i18n="vote.skip"></button>
      <p class="vote-count" id="vote-count"></p>
    </div>

    <p class="kbd-hint" data-i18n-html="vote.kbdHtml"></p>

    <div class="banner" id="mode-banner" role="status" hidden></div>

    <!-- Dopo un voto le quattro immagini cambiano ma il fuoco resta dov'e':
         senza questo, chi non vede non sa che e' comparsa una nuova sfida. -->
    <p class="visually-hidden" id="challenge-live" aria-live="polite"></p>
  </section>

  <!-- ======================================================= CLASSIFICA -->
  <section id="view-classifica" class="view" tabindex="-1" hidden>
    <div class="rank-head">
      <h1 data-i18n="rank.title"></h1>
      <div class="seg" role="group" data-i18n-aria="rank.scopeLabel">
        <button type="button" class="seg-btn is-active" data-scope="banconote" data-i18n="scope.note"></button>
        <button type="button" class="seg-btn" data-scope="disegni" data-i18n="scope.design"></button>
      </div>
    </div>

    <p class="rank-summary" id="rank-summary"></p>

    <div id="rank-notes">
      <ol class="ranking" id="ranking-notes-list"></ol>
      <div class="more-wrap"><button type="button" class="btn" id="btn-more" hidden></button></div>
    </div>

    <div id="rank-designs" hidden>
      <p class="scope-note" data-i18n="rank.noteDesign"></p>
      <ol class="ranking" id="ranking-designs-list"></ol>
    </div>
  </section>

  <!-- ========================================================== DESIGN -->
  <section id="view-design" class="view" tabindex="-1" hidden>
    <h1 data-i18n="designs.title"></h1>
    <p class="lede" data-i18n-html="designs.ledeHtml"></p>
    <div class="design-grid" id="design-grid"></div>
  </section>

  <!-- ========================================================== METODO -->
  <section id="view-metodo" class="view" tabindex="-1" hidden>
    <h1 data-i18n="method.title"></h1>
    <div id="method-body"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-controls">
      <div class="picker">
        <span class="picker-label" data-i18n="footer.theme"></span>
        <div class="seg seg-sm" id="theme-buttons" role="group" data-i18n-aria="footer.theme"></div>
      </div>
      <div class="picker">
        <span class="picker-label" data-i18n="footer.language"></span>
        <div class="seg seg-sm" id="lang-buttons" role="group" data-i18n-aria="footer.language"></div>
      </div>
    </div>
    <p class="footer-credit" data-i18n-html="footer.creditHtml"></p>
    <p class="footer-note" data-i18n-html="footer.attributionHtml"></p>
    <p class="footer-note" id="recaptcha-note" data-i18n-html="footer.recaptchaHtml" hidden></p>
  </div>
</footer>

<script type="importmap">
{
  "imports": {
    "./src/app-check.js": "./src/app-check.js?v=e37e79db",
    "./src/data.js": "./src/data.js?v=aa8b3bae",
    "./src/design-texts.js": "./src/design-texts.js?v=90993af7",
    "./src/i18n.js": "./src/i18n.js?v=4c87876a",
    "./src/image-aspects.js": "./src/image-aspects.js?v=a7a5579f",
    "./src/rating.js": "./src/rating.js?v=333aa031",
    "./src/store.js": "./src/store.js?v=760ad3e3",
    "./config.js": "./config.js?v=ed8441b1"
  }
}
</script>
<script type="module" src="src/app.js?v=4669d3ef"></script>
</body>
</html>
