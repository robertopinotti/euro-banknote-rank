name: Pubblica su GitHub Pages

# Il sito e' statico e senza build: si pubblica il repository cosi' com'e'.
# Il workflow gira a ogni push sul branch di default e si puo' lanciare a mano
# dalla scheda Actions.
on:
  push:
    branches: [claude/eu-banknote-voting-a65myy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta. Le esecuzioni gia' in coda vengono scartate,
# ma quella in corso viene lasciata finire: interrompere un deploy a meta'
# lascerebbe il sito in uno stato incoerente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Il motore di classifica: la parte con la logica vera.
      - run: node --test test/rating.test.mjs

      # Le regole di sicurezza Firestore, provate contro l'emulatore. Sul piano
      # gratuito sono l'unica difesa dei dati, quindi una build verde deve
      # significare anche che restano solide. L'emulatore gira su Java, gia'
      # presente sui runner GitHub.
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true crea il sito Pages se non esiste ancora. Con il
      # repository privato falliva ("Resource not accessible by integration"):
      # Pages non era disponibile sul piano, e l'errore arrivava travestito da
      # problema di permessi. Da repository pubblico Pages e' disponibile.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
