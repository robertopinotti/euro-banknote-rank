name: Publish to GitHub Pages

# The site is static and build-free: the repository is published as it is.
# This runs on every push to the default branch, and can be started by hand
# from the Actions tab.
on:
  push:
    branches: [claude/eu-banknote-voting-a65myy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publication at a time. Queued runs are dropped, but the one in flight is
# allowed to finish: interrupting a deploy halfway would leave the site in an
# inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The rating engine: the part with the real logic.
      - run: node --test test/rating.test.mjs

      # The Firestore security rules, exercised against the emulator. On the
      # free plan they are the only thing protecting the data, so a green build
      # has to mean they still hold. The emulator runs on Java, already present
      # on GitHub runners.
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Re-stamp CSS and scripts with their content fingerprint. GitHub Pages
      # serves every file with its own ten-minute cache, so without this a
      # browser can end up with the new HTML and the old CSS after a deploy,
      # and the page comes out broken.
      - run: node tools/stamp-assets.mjs

      # enablement: true creates the Pages site if it does not exist yet. On a
      # private repository this failed with "Resource not accessible by
      # integration": Pages was not available on that plan, and the error
      # arrived disguised as a permissions problem. On a public repository
      # Pages is available.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
